spring:
  application:
    name: text-to-sql-agent
  profiles:
    active: ollama
  main:
    allow-bean-definition-overriding: true
  
  # MySQL Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:texttosql}
    password: ${DATABASE_PASSWORD:SecurePassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

# Embabel Configuration
embabel:
  agent:
    # Enable web mode for REST API
    mode: web
    
    # Logging theme (optional - star-wars, mandalorian, or vanilla)
    logging:
      theme: star-wars
    
    # Planning configuration
    planning:
      max-iterations: 10
      cost-threshold: 100
  models:
    default-llm: llama3.1:latest
  llm-operations:
    data-binding:
      maxAttempts: 3

# LLM Configuration - Using Ollama (Local, Free)
spring.ai:
  ollama:
    base-url: http://localhost:11434
    chat:
      options:
        model: llama3.1
        temperature: 0.7

# Query constraints
texttosql:
  max-rows: 500
  timeout-seconds: 30
  allowed-operations:
    - SELECT
  blocked-keywords:
    - DROP
    - DELETE
    - INSERT
    - UPDATE
    - TRUNCATE
    - ALTER
    - CREATE
    - GRANT
    - REVOKE

# Swagger/OpenAPI configuration
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1


# Logging
logging:
  level:
    com.texttosql: DEBUG
    com.embabel: INFO
    org.springframework.ai: DEBUG
    org.springdoc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"